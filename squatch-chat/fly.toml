# Campfire Online on Fly.io: the Dockerfile in this directory, one always-on
# machine, PostgreSQL elsewhere (Neon), uploads on a Fly volume.
# Owner runbook: docs/LAUNCH.md "Go live". Secrets are never in this file;
# `fly secrets set` holds them (the runbook names every one).
#
# Fly app names are global: if `campfire-online` is taken, pick another name
# and change it here and in the runbook commands.
app = "campfire-online"
# Put the app next to the database: create Neon in AWS us-east-1 for `iad`.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs in a throwaway machine before the live one is touched: refuses the
  # deploy when a required setting is missing, then applies migrations.
  # ponytail: the image's start.sh migrates again on boot; that second run is a
  # no-op here and keeps plain `docker compose` working unchanged.
  release_command = "npm run deploy:release"

[env]
  NODE_ENV = "production"
  CAMPFIRE_EDITION = "cloud"
  STRICT_CORS = "true"
  CAMPFIRE_TELEMETRY_COLLECTOR = "1"
  CAMPFIRE_UPLOAD_DIR = "/app/media"
  # Fly's proxy appends "<client>, <this app's IP>" to X-Forwarded-For, so the
  # caller is second from the right; anything a caller sends lands further left.
  CAMPFIRE_TRUST_PROXY_HOPS = "2"

[http_service]
  internal_port = 3000
  force_https = true
  # Never stop: Socket.IO sessions, voice signaling, and the scheduled-message,
  # reminder, and retention workers all live in this one process.
  auto_stop_machines = "off"
  auto_start_machines = true
  [http_service.concurrency]
    type = "connections"
    # Every open tab holds one WebSocket; the default soft limit (20) is far
    # below what one machine carries.
    soft_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"

# Uploads, avatars, and private attachments (Campfire creates the
# uploads/, avatars/, private-uploads/ subfolders). Fly snapshots it daily.
[[mounts]]
  source = "campfire_media"
  destination = "/app/media"
  initial_size = "1gb"

# ponytail: exactly one machine. Rate limits, voice rooms, and Lantern/Offshoot
# state are per process; a second machine needs shared state first.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
